name: Documentation Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_run:
        description: Successful production release workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  publication-gate:
    name: Verify accepted public production release
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'kgmnotes/xferry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install offline signature verifier dependency
        run: python -m pip install -c constraints/ci.txt 'cryptography>=50.0'
      - name: Install pinned cryptographic attestation verifier
        run: |
          set -euo pipefail
          python tools/install_attestation_cli.py --output-bin "$RUNNER_TEMP/xferry-attestation-bin"
          echo "$RUNNER_TEMP/xferry-attestation-bin" >> "$GITHUB_PATH"
      - name: Verify production run, signed public bytes, and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_RUN: ${{ inputs.production_run }}
          DOCUMENTATION_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/docs_publication.py --production-run "$PRODUCTION_RUN" \
            --documentation-commit "$DOCUMENTATION_COMMIT"

  build:
    name: Build strict documentation
    needs: [publication-gate]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.repository == 'kgmnotes/xferry' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && needs.publication-gate.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci.txt -e ".[docs,lint]"

      - name: Validate documentation contracts
        run: |
          set -euo pipefail
          python tools/render_settings.py --check
          python tools/render_contracts.py --check
          python tools/sync_docs.py --check
          python tools/check_stale_docs.py
          mkdocs build --strict

      - name: Upload accepted Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' && needs.publication-gate.result == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy accepted production documentation
    needs: [publication-gate, build]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'kgmnotes/xferry' && needs.publication-gate.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck current main after publication approval
        env:
          DOCUMENTATION_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 \
            --header 'Accept: application/vnd.github+json' --output current-main.json \
            'https://api.github.com/repos/kgmnotes/xferry/git/ref/heads/main'
          jq --exit-status --arg expected "$DOCUMENTATION_COMMIT" \
            '.ref == "refs/heads/main" and .object.type == "commit" and .object.sha == $expected' \
            current-main.json
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # actions/deploy-pages@v5.0.1
