name: Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: constraints/ci.txt
  SCIENCE_NET_TIMEOUT: "60"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify Python build products
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install verification toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build pip-audit

      - name: Check source version
        run: |
          set -euo pipefail
          python - <<'PY'
          from xferry.config import __version__
          from xferry.management.versions import is_supported_release_version

          if not is_supported_release_version(__version__):
              raise SystemExit(f"unsupported XFerry source release line: {__version__}")
          PY

      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist

      - name: Validate wheel and sdist contents
        run: |
          set -euo pipefail
          python tools/verify_python_artifacts.py validate \
            --workspace "$GITHUB_WORKSPACE" \
            --wheel 'dist/xferry-*.whl' \
            --sdist 'dist/xferry-*.tar.gz'

      - name: Prepare Python artifact wheelhouse
        run: |
          set -euo pipefail
          python tools/verify_python_artifacts.py prepare-wheelhouse \
            --workspace "$GITHUB_WORKSPACE" \
            --wheel 'dist/xferry-*.whl' \
            --wheelhouse "$RUNNER_TEMP/xferry-artifact-wheelhouse" \
            --constraints "$GITHUB_WORKSPACE/constraints/ci.txt"

      - name: Offline wheel and sdist smoke
        run: |
          set -euo pipefail
          python tools/verify_python_artifacts.py offline-smoke \
            --workspace "$GITHUB_WORKSPACE" \
            --wheel 'dist/xferry-*.whl' \
            --sdist 'dist/xferry-*.tar.gz' \
            --wheelhouse "$RUNNER_TEMP/xferry-artifact-wheelhouse" \
            --fresh-root "$RUNNER_TEMP/xferry-fresh-artifacts" \
            --constraints "$GITHUB_WORKSPACE/constraints/ci.txt"

      - name: Static UI wheel asset check
        run: python tools/check_static_ui_assets.py --wheel-only --wheel 'dist/xferry-*.whl'

      - name: Scan pinned dependencies and render a local SBOM
        run: |
          set -euo pipefail
          python -m pip_audit --strict --no-deps -r constraints/ci.txt
          python -m pip_audit \
            --strict \
            --no-deps \
            -r constraints/ci.txt \
            -f cyclonedx-json \
            -o dist/xferry-dependency-sbom.cdx.json

  image-verify:
    name: Verify local Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Chromium for image first-run
        run: |
          set -euo pipefail
          npx --yes --package @playwright/cli@0.1.9 playwright-cli install-browser chromium --with-deps

      - name: Build local image for lifecycle smoke
        run: docker build --tag xferry:release-smoke .

      - name: Hardened local image lifecycle smoke
        run: |
          set -euo pipefail
          python tools/docker_image_smoke.py \
            --image xferry:release-smoke \
            --browser-first-run \
            --browser-artifacts-dir "$RUNNER_TEMP/browser-smoke-artifacts/image-first-run"

  scie-verify:
    name: Verify local SCIE build products (${{ matrix.platform }}, native)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            machine: x86_64
            docker_platform: linux/amd64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            machine: aarch64
            docker_platform: linux/arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install SCIE verification toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build pex==2.99.0

      - name: Confirm native build architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          printf 'platform=%s runner_machine=%s evidence=native\n' \
            '${{ matrix.platform }}' "$(uname -m)"

      - name: Build deterministic SCIE release bundle
        run: |
          set -euo pipefail
          python tools/build_scie_release.py \
            --platform '${{ matrix.platform }}' \
            --output-dir 'dist/scie-${{ matrix.platform }}'

      - name: Verify SCIE manifest and checksums
        env:
          SCIE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          from xferry.management.release_contract import ReleaseManifest

          platform = os.environ["SCIE_PLATFORM"]
          bundle = Path(f"dist/scie-{platform}")
          manifest = ReleaseManifest.parse_new((bundle / "xferry-release.json").read_bytes())
          executable = bundle / manifest.executable_name
          digest = hashlib.sha256(executable.read_bytes()).hexdigest()
          assert manifest.schema_version == 2
          assert manifest.platform == platform
          assert executable.stat().st_size == manifest.executable_size
          assert digest == manifest.executable_sha256
          assert (bundle / "SHA256SUMS").read_text(encoding="utf-8") == (
              f"{digest}  {executable.name}\n"
          )
          assert {path.name for path in bundle.iterdir()} == {
              "SHA256SUMS",
              "install.sh",
              "xferry-release.json",
              executable.name,
          }
          PY

      - name: Smoke SCIE without host Python
        run: |
          set -euo pipefail
          executable="$(find "$PWD/dist/scie-${{ matrix.platform }}" -maxdepth 1 -type f -name 'xferry-*-linux-*')"
          PATH=/nonexistent "$executable" run --version
          PATH=/nonexistent "$executable" --help > /dev/null
          PATH=/nonexistent "$executable" run --check-config

      - name: Smoke SCIE on every supported Linux base
        run: |
          set -euo pipefail
          bundle="$PWD/dist/scie-${{ matrix.platform }}"
          executable="$(basename "$(find "$bundle" -maxdepth 1 -type f -name 'xferry-*-linux-*')")"
          for image in ubuntu:22.04 ubuntu:24.04 ubuntu:26.04 debian:12 debian:13; do
            printf 'platform=%s image=%s evidence=native\n' '${{ matrix.platform }}' "$image"
            docker run --rm \
              --platform '${{ matrix.docker_platform }}' \
              --volume "$bundle:/release:ro" \
              "$image" \
              /bin/sh -eu -c '
                test "$(uname -m)" = "$1"
                candidate="/release/$2"
                "$candidate" run --version
                "$candidate" --help > /dev/null
                "$candidate" run --check-config
              ' sh '${{ matrix.machine }}' "$executable"
          done

      - name: Exercise isolated managed lifecycle and failure paths
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_scie_release.py \
            tests/test_management_setup.py::test_setup_writes_atomic_strict_files_and_keeps_secret_out_of_processes \
            tests/test_management_service.py::test_cli_status_and_doctor_render_secret_free_stable_json \
            tests/test_management_releases.py::test_default_rollback_selects_previous_verified_release_and_keeps_old_current \
            tests/test_management_releases.py::test_default_uninstall_removes_only_managed_runtime_and_preserves_state

  release-gate:
    name: Confirm verification lanes
    runs-on: ubuntu-latest
    needs: [build, image-verify, scie-verify]
    permissions:
      contents: read

    steps:
      - name: Confirm local verification outputs
        run: echo "Python, Docker, and SCIE build products were verified without publication."
