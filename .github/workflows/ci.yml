name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_CONSTRAINT: constraints/ci.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lint,test]"

      - name: Dependency completeness smoke
        run: |
          set -euo pipefail
          python -m pip check
          python -m xferry --help > /dev/null
          python -c "import acme, cryptography, josepy; from OpenSSL import SSL"

      - name: Pytest collection policy
        run: python tools/check_pytest_collection_policy.py

      - name: Toolchain pin contract
        run: python tools/check_toolchain_pins.py

      - name: Public surface policy
        run: python tools/check_public_surface.py

      - name: Lint (ruff)
        run: ruff check xferry tests tools

      - name: Format check (ruff)
        run: ruff format --check xferry tests tools

      - name: Type check (mypy)
        run: mypy xferry

      - name: Test (pytest + coverage)
        run: pytest --cov=xferry --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  python314-readiness:
    name: Python 3.14 package and security smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install readiness dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lint,test]" build pip-audit

      - name: Runtime and security smoke
        run: |
          set -euo pipefail
          python -m pip check
          python -m xferry --help > /dev/null
          python -c "import acme, cryptography, josepy; from OpenSSL import SSL"
          python tools/check_dependency_constraints.py --constraints constraints/ci.txt
          python -m pip_audit --strict --no-deps -r constraints/ci.txt

      - name: Build package artifacts
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build --sdist --wheel --outdir dist

      - name: Validate wheel and sdist contents
        run: |
          set -euo pipefail
          python tools/verify_python_artifacts.py validate \
            --workspace "$GITHUB_WORKSPACE" \
            --wheel 'dist/xferry-*.whl' \
            --sdist 'dist/xferry-*.tar.gz'

      - name: Prepare Python artifact wheelhouse
        run: |
          set -euo pipefail
          python tools/verify_python_artifacts.py prepare-wheelhouse \
            --workspace "$GITHUB_WORKSPACE" \
            --wheel 'dist/xferry-*.whl' \
            --wheelhouse "$RUNNER_TEMP/xferry-artifact-wheelhouse" \
            --constraints "$GITHUB_WORKSPACE/constraints/ci.txt"

      - name: Offline wheel and sdist smoke
        run: |
          set -euo pipefail
          python tools/verify_python_artifacts.py offline-smoke \
            --workspace "$GITHUB_WORKSPACE" \
            --wheel 'dist/xferry-*.whl' \
            --sdist 'dist/xferry-*.tar.gz' \
            --wheelhouse "$RUNNER_TEMP/xferry-artifact-wheelhouse" \
            --fresh-root "$RUNNER_TEMP/xferry-fresh-artifacts" \
            --constraints "$GITHUB_WORKSPACE/constraints/ci.txt"

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,lint]"

      - name: Check generated docs and semantic guards
        run: |
          set -euo pipefail
          ruff check tools/sync_docs.py tools/check_stale_docs.py
          python tools/sync_docs.py --check
          python tools/check_stale_docs.py

      - name: Build docs
        run: |
          set -euo pipefail
          mkdocs build --strict

  risk-lanes:
    name: Risk lanes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Risk lane - parser and framing
        run: |
          python -m pytest -q \
            tests/test_property/test_request_parser.py \
            tests/test_property/test_ws_frame_parser.py \
            tests/test_http/test_content_length_smuggling.py \
            tests/test_security/test_websocket_frame_limit.py

      - name: Risk lane - auth
        run: python -m pytest -q tests/test_security/test_auth.py

      - name: Risk lane - CORS and method policy
        run: |
          python -m pytest -q \
            tests/test_handler_registry.py \
            tests/test_request_pipeline.py \
            tests/test_server_methods.py \
            tests/test_security/test_websocket_upgrade.py

      - name: Risk lane - storage and quota
        run: |
          python -m pytest -q \
            tests/test_handlers/test_files.py \
            tests/test_handlers/test_notepad.py

      - name: Risk lane - WebSocket and Notepad
        run: |
          python -m pytest -q \
            tests/test_websocket.py \
            tests/test_websocket_handlers.py \
            tests/test_handlers/test_notepad.py \
            tests/test_security/test_websocket_upgrade.py

  cross-platform:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Dependency completeness smoke
        run: |
          python -m pip check
          python -m xferry --help
          python -c "import acme, cryptography, josepy; from OpenSSL import SSL"

      - name: CLI smoke
        run: |
          python -m xferry run --version
          python -m xferry run --help
          python -m xferry --help
          xferry --help
          xferry run --help

      - name: Portable unit subset
        run: pytest -q tests/test_http tests/test_security/test_crypto.py tests/test_cli.py

  smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install smoke-check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lint,test]"

      - name: Static UI release gates
        run: |
          set -euo pipefail
          wheel_dir="${RUNNER_TEMP}/xferry-browser-wheel"
          rm -rf "${wheel_dir}"
          mkdir -p "${wheel_dir}"
          python -m pip wheel . --no-deps --wheel-dir "${wheel_dir}"
          python tools/check_static_ui_assets.py --wheel "${wheel_dir}"/xferry-*.whl
          node --check tools/browser_smoke.playwright.js

      - name: Prepare installed-wheel browser target
        run: |
          set -euo pipefail
          wheel_venv="${RUNNER_TEMP}/xferry-browser-wheel-venv"
          python -m venv "${wheel_venv}"
          "${wheel_venv}/bin/python" -m pip install --upgrade pip
          "${wheel_venv}/bin/pip" install "${RUNNER_TEMP}"/xferry-browser-wheel/xferry-*.whl

      - name: Install Chromium for browser smoke
        run: |
          npx --yes --package @playwright/cli@0.1.9 playwright-cli install-browser chromium --with-deps

      - name: CLI, docs, and example sanity checks
        run: |
          set -euo pipefail
          python -m xferry run --dir /tmp --version
          python -m xferry --help > /dev/null
          bash -n examples/basic_file_server.sh
          python examples/notepad_client.py --help > /dev/null
          python tools/check_stale_docs.py

      - name: Compact source and wheel browser journeys
        run: |
          set -euo pipefail
          artifacts="${RUNNER_TEMP}/browser-smoke-artifacts"
          source_pid=""
          wheel_pid=""
          mkdir -p "${artifacts}"
          allocate_port() {
            python - <<'PY'
          import socket

          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          }
          wait_for_target() {
            local url="$1"
            local log_path="$2"
            for _ in {1..100}; do
              if curl --noproxy '*' -fsS -X PING "${url}" >/dev/null; then
                return 0
              fi
              sleep 0.1
            done
            cat "${log_path}" >&2 || true
            return 1
          }
          cleanup_browser_targets() {
            if [ -n "${source_pid}" ]; then
              kill "${source_pid}" >/dev/null 2>&1 || true
              wait "${source_pid}" >/dev/null 2>&1 || true
            fi
            if [ -n "${wheel_pid}" ]; then
              kill "${wheel_pid}" >/dev/null 2>&1 || true
              wait "${wheel_pid}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_browser_targets EXIT

          source_port="$(allocate_port)"
          mkdir -p "${RUNNER_TEMP}/xferry-browser-source-root"
          python -m xferry \
            run \
            --host 127.0.0.1 \
            --port "${source_port}" \
            --dir "${RUNNER_TEMP}/xferry-browser-source-root" \
            --quiet >"${artifacts}/source-server.log" 2>&1 &
          source_pid="$!"
          wait_for_target \
            "http://127.0.0.1:${source_port}/" \
            "${artifacts}/source-server.log"
          python tools/browser_smoke.py \
            --mode first-run \
            --target-url "http://127.0.0.1:${source_port}/" \
            --artifacts-dir "${artifacts}/source-first-run"
          python tools/browser_smoke.py \
            --mode ui-contracts \
            --target-url "http://127.0.0.1:${source_port}/" \
            --artifacts-dir "${artifacts}/source-ui-contracts"

          wheel_port="$(allocate_port)"
          mkdir -p "${RUNNER_TEMP}/xferry-browser-wheel-root"
          (
            cd "${RUNNER_TEMP}"
            exec "${RUNNER_TEMP}/xferry-browser-wheel-venv/bin/xferry" \
              run \
              --host 127.0.0.1 \
              --port "${wheel_port}" \
              --dir "${RUNNER_TEMP}/xferry-browser-wheel-root" \
              --quiet
          ) >"${artifacts}/wheel-server.log" 2>&1 &
          wheel_pid="$!"
          wait_for_target \
            "http://127.0.0.1:${wheel_port}/" \
            "${artifacts}/wheel-server.log"
          python tools/browser_smoke.py \
            --mode first-run \
            --target-url "http://127.0.0.1:${wheel_port}/" \
            --artifacts-dir "${artifacts}/wheel-first-run"

      - name: Full browser aggregate on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python tools/browser_smoke.py \
            --mode full \
            --artifacts-dir "${RUNNER_TEMP}/browser-smoke-artifacts/source-full"

      - name: Docker smoke
        run: |
          set -euo pipefail
          http_cid=""
          tls_cid=""
          auth_secret=""
          cleanup() {
            if [ -n "${http_cid}" ]; then
              docker rm -f "${http_cid}" >/dev/null 2>&1 || true
            fi
            if [ -n "${tls_cid}" ]; then
              docker rm -f "${tls_cid}" >/dev/null 2>&1 || true
            fi
            if [ -n "${auth_secret}" ]; then
              rm -f "${auth_secret}"
            fi
          }
          wait_health() {
            local cid="$1"
            local status=""
            for _ in {1..30}; do
              status="$(
                docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${cid}"
              )"
              if [ "${status}" = "healthy" ]; then
                return 0
              fi
              if [ "${status}" = "unhealthy" ]; then
                docker inspect "${cid}"
                return 1
              fi
              sleep 1
            done
            echo "container ${cid} did not become healthy; last status=${status}" >&2
            docker inspect "${cid}"
            return 1
          }
          probe_ping() {
            local url="$1"
            local output="$2"
            shift 2
            for _ in {1..30}; do
              if curl --noproxy '*' "$@" -fsS -X PING "${url}" | tee "${output}"; then
                python -c 'import json, sys; data=json.load(open(sys.argv[1], encoding="utf-8")); health=data.get("health"); methods=set(data.get("supported_methods") or ()); legacy_fields={"status", "ok", "success"}.intersection(data); assert health == "ready", f"unexpected PING health: {health!r}"; assert not legacy_fields, f"forbidden legacy PING fields: {legacy_fields!r}"; assert {"NOTE", "SMUGGLE"}.issubset(methods), f"missing full-mode methods: {methods!r}"; assert "profile" not in data, "PING must not expose profile"; assert "capabilities" not in data, "PING must not expose capabilities"' "${output}" && return 0
              fi
              sleep 1
            done
            return 1
          }
          trap cleanup EXIT

          docker build -t xferry:ci .
          python tools/verify_docker_image.py --image xferry:ci
          docker run --rm --entrypoint python xferry:ci \
            -c "import acme, cryptography, josepy; from OpenSSL import SSL"
          docker run --rm xferry:ci run --version
          python tools/docker_image_smoke.py \
            --image xferry:ci \
            --browser-first-run \
            --browser-artifacts-dir "${RUNNER_TEMP}/browser-smoke-artifacts/docker-first-run"
          http_cid="$(docker run -d -p 127.0.0.1::8080 xferry:ci)"
          http_port="$(docker port "${http_cid}" 8080/tcp | awk -F: '{print $NF}')"
          wait_health "${http_cid}"
          if ! probe_ping "http://127.0.0.1:${http_port}/" /tmp/ping.json; then
            docker logs "${http_cid}"
            exit 1
          fi

          auth_secret="$(mktemp)"
          printf 'ci:docker-smoke-password\n' > "${auth_secret}"
          chmod 644 "${auth_secret}"
          tls_cid="$(
            docker run -d --no-healthcheck \
              -p 127.0.0.1::8443 \
              -v "${auth_secret}:/run/secrets/xferry_auth:ro" \
              xferry:ci \
              run \
              --host 0.0.0.0 \
              --port 8443 \
              --dir /data \
              --tls \
              --auth-file /run/secrets/xferry_auth
          )"
          if [ "$(docker inspect --format '{{if .Config.Healthcheck}}{{json .Config.Healthcheck.Test}}{{else}}null{{end}}' "${tls_cid}")" != '["NONE"]' ]; then
            docker inspect "${tls_cid}"
            exit 1
          fi
          tls_port="$(docker port "${tls_cid}" 8443/tcp | awk -F: '{print $NF}')"
          if ! probe_ping "https://127.0.0.1:${tls_port}/" /tmp/tls-ping.json -k -u ci:docker-smoke-password; then
            docker logs "${tls_cid}"
            exit 1
          fi

      - name: Upload browser journey diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: browser-journeys-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 14

  scie-verify:
    name: Build and verify SCIE bundle
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Install pinned SCIE toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build pex==2.99.0

      - name: Build SCIE bundle
        run: python tools/build_scie_release.py --output-dir dist/scie

      - name: Validate SCIE manifest, checksum, and canonical CLI
        run: |
          set -euo pipefail
          executable="$(find dist/scie -maxdepth 1 -type f -name 'xferry-*-linux-x86_64')"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bundle = Path("dist/scie")
          manifest = json.loads((bundle / "xferry-release.json").read_text(encoding="utf-8"))
          executable = bundle / manifest["executable"]["name"]
          digest = hashlib.sha256(executable.read_bytes()).hexdigest()
          assert executable.stat().st_size == manifest["executable"]["size"]
          assert digest == manifest["executable"]["sha256"]
          assert (bundle / "SHA256SUMS").read_text(encoding="utf-8") == (
              f"{digest}  {executable.name}\n"
          )
          PY
          "${executable}" run --version
          "${executable}" run --check-config
