name: TestPyPI Candidate Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm_testpypi:
        description: Upload the immutable STAGE-009 xferry 0.1.0 candidate to TestPyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: testpypi-xferry-0.1.0
  cancel-in-progress: false

jobs:
  identity:
    if: ${{ inputs.confirm_testpypi && github.repository == 'kgmnotes/xferry' && github.ref == 'refs/heads/codex/stage-010-testpypi-rehearsal' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify fixed producer identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/kgmnotes/xferry/actions/artifacts/11095067140 > artifact.json
          gh api repos/kgmnotes/xferry/actions/runs/36712344792 > run.json
          python tools/testpypi_publish.py identity --artifact-metadata artifact.json --run-metadata run.json

  publish:
    needs: identity
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download immutable STAGE-009 candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8
        with:
          repository: kgmnotes/xferry
          run-id: 36712344792
          artifact-ids: 11095067140
          github-token: ${{ github.token }}
          merge-multiple: true
          path: downloaded
      - name: Authenticate candidate and prepare unchanged distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/kgmnotes/xferry/actions/artifacts/11095067140 > artifact.json
          gh api repos/kgmnotes/xferry/actions/runs/36712344792 > run.json
          python tools/testpypi_publish.py prepare --artifact-metadata artifact.json --run-metadata run.json \
            --archive downloaded/release-candidate.tar --candidate-dir promoted --packages-dir dist
      - name: Trusted Publishing to TestPyPI only
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          attestations: true

  pipx-smoke:
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pipx verifier
        run: python -m pip --isolated install --index-url https://pypi.org/simple/ pipx==1.8.0
      - name: Prove accepted TestPyPI bytes and actual isolated pipx journey
        shell: bash
        run: |
          set -euo pipefail
          python tools/testpypi_publish.py smoke \
            --download-dir "$RUNNER_TEMP/testpypi-accepted" --fresh-root "$RUNNER_TEMP/testpypi-pipx"
      - name: Preserve TestPyPI acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: testpypi-receipt-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testpypi-accepted/testpypi-receipt.json
          if-no-files-found: error
          retention-days: 14
