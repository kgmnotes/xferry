name: TestPyPI Candidate Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm_testpypi:
        description: Upload the immutable STAGE-009 xferry 0.1.0 candidate to TestPyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: testpypi-xferry-0.1.0
  cancel-in-progress: false

jobs:
  identity:
    if: ${{ inputs.confirm_testpypi && github.repository == 'kgmnotes/xferry' && github.ref == 'refs/heads/codex/stage-010-testpypi-rehearsal-v2' }}
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.staged-distributions.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Require protected rehearsal branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/codex%2Fstage-010-testpypi-rehearsal-v2")"
          test "$(jq -r '.commit.sha' <<<"${branch_json}")" = "${GITHUB_SHA}"
          test "$(jq -r '.protected' <<<"${branch_json}")" = "true"
      - name: Verify fixed producer identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/kgmnotes/xferry/actions/artifacts/11095067140 > artifact.json
          gh api repos/kgmnotes/xferry/actions/runs/36712344792 > run.json
          python tools/testpypi_publish.py identity --artifact-metadata artifact.json --run-metadata run.json
      - name: Download immutable STAGE-009 candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          repository: kgmnotes/xferry
          run-id: 36712344792
          artifact-ids: 11095067140
          github-token: ${{ github.token }}
          merge-multiple: true
          path: downloaded
      - name: Authenticate candidate and prepare unchanged distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/testpypi_publish.py prepare --artifact-metadata artifact.json --run-metadata run.json \
            --archive downloaded/release-candidate.tar --candidate-dir promoted --packages-dir dist
      - name: Preserve authenticated distributions for the OIDC job
        id: staged-distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: authenticated-testpypi-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: identity
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download authenticated candidate distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.identity.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Trusted Publishing to TestPyPI only
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          attestations: true

  pipx-smoke:
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install pipx verifier
        run: python -m pip --isolated install --index-url https://pypi.org/simple/ pipx==1.8.0
      - name: Prove accepted TestPyPI bytes and actual isolated pipx journey
        shell: bash
        run: |
          set -euo pipefail
          python tools/testpypi_publish.py smoke \
            --download-dir "$RUNNER_TEMP/testpypi-accepted" --fresh-root "$RUNNER_TEMP/testpypi-pipx"
      - name: Preserve TestPyPI acceptance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7
        with:
          name: testpypi-receipt-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testpypi-accepted/testpypi-receipt.json
          if-no-files-found: error
          retention-days: 14
