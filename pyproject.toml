[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xferry"
dynamic = ["version"]
description = "Controlled HTTP toolkit for Secure Web Gateway testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
keywords = [
    "http",
    "server",
    "tls",
    "https",
    "dlp",
    "red-team",
    "secure-web-gateway",
    "swg",
    "file-upload",
    "file-server",
    "advanced-upload",
    "custom-methods",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "acme>=5.5,<6",
    "cryptography>=50.0",
    "defusedxml==0.7.1",
    "josepy>=2.2,<3",
]

[project.urls]
Repository = "https://github.com/kgmnotes/xferry"
Issues = "https://github.com/kgmnotes/xferry/issues"

[project.scripts]
xferry = "xferry.management.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.0",
    "pre-commit>=4.6.0",
    "setuptools>=75.0",
    "wheel>=0.45",
]
lint = [
    "ruff>=0.15.5",
    "mypy>=1.20.1",
]
test = [
    "hypothesis>=6.0",
    "pytest-benchmark>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
all = [
    "xferry[dev,lint,test,docs]",
]

[tool.setuptools.dynamic]
version = {attr = "xferry.config.__version__"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["xferry*"]
exclude = ["xferry*.__pycache__"]
namespaces = false

[tool.setuptools.package-data]
"xferry" = [
    "data/*.html",
    "data/static/*",
    "data/static/ui/*",
    "management/data/*.service",
    "py.typed",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "__pycache__/*",
    "*.py[cod]",
]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"

# coverage configuration
[tool.coverage.run]
source = ["xferry"]
branch = true

[tool.coverage.report]
fail_under = 85
precision = 2
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

# ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = ["tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Minified CSS/HTML/SVG in template strings cannot be line-wrapped
"xferry/smuggle/_constructor_primitives.py" = ["E501"]
"xferry/utils/captcha.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# mypy configuration
[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
