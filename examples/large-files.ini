# Resource profile for the private large-file service. Merge these sections
# into the deployment's existing config; retain its files_dir, HTTPS and auth_file.
[server]
encrypted_uploads = true
workers = 8

[limits]
# 0 means automatic admission by remaining quota and free space.
encrypted_upload_max_size_mb = 0
upload_storage_limit_mb = 24576
upload_reserve_free_mb = 4096
upload_file_limit = 4096
encrypted_upload_incomplete_ttl_seconds = 604800
body_memory_budget_mb = 64
